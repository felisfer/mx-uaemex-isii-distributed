name: Build, test and deploy frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}-frontend
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.frontend_changed }}
    steps:
    # Checkout the code
    # https://github.com/actions/checkout
    - uses: actions/checkout@v7

    # Use dorny/paths-filter to check if frontend files have changed`
    # https://github.com/dorny/paths-filter
    - uses: dorny/paths-filter@v4.0.3
      id: filter
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      with:
        filters: |
          frontend_changed: ["frontend/**"]
      
  lint-and-build:
    name: Lint, type-check y build (frontend)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend_changed == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ESLint
        run: pnpm run lint

      - name: Verificar tipos (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Verificar build de producción
        run: pnpm run build
  
  security-scan:
    name: Security scans (frontend)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend_changed == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar pnpm
        uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias (npm audit)
        run: pnpm audit --audit-level=high

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  publish-docker-image:
    needs: [lint-and-build, security-scan]
    name: Publish Docker image into GHCR (frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      # Scan image for vulnerabilities
      # https://github.com/aquasecurity/trivy-action
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
